version: 2
updates:
  # GH Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 25
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Composer
  - package-ecosystem: "composer"
    directory: "/"
    open-pull-requests-limit: 25
    schedule:
      interval: "weekly"
    groups:
      composer-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # NPM
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 25
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
